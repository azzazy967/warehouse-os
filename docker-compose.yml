# Local PostgreSQL for testing the API in production (DB_TYPE=postgres) mode.
# For real deployments, override credentials via environment variables or your
# orchestrator's secret manager. Do not use these defaults in production.
services:
  db:
    image: postgres:16-alpine
    container_name: warehouse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-warehouse}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-warehouse}
      POSTGRES_DB: ${DB_NAME:-warehouse_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - warehouse-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-warehouse} -d ${DB_NAME:-warehouse_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  warehouse-pgdata:
  # Product images: mount this at UPLOAD_DIR in the API service so files survive
  # redeploys (e.g. - warehouse-uploads:/var/lib/warehouse/uploads).
  warehouse-uploads:
