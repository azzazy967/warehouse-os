# Warehouse OS - production reverse proxy
# Serves the built SPA (frontend/dist), proxies /api to NestJS, and forwards
# /uploads to the API for product images.
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/warehouse
#   sudo ln -s /etc/nginx/sites-available/warehouse /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Adjust SERVER_NAME, the SPA root path, and TLS as appropriate for your host.
# Terminate TLS here (or at a load balancer in front of this server).

server {
    listen 80;
    server_name warehouse.example.com;

    # Redirect all plain HTTP to HTTPS. Remove this block if TLS is terminated
    # upstream and this server is reached over the internal network only.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name warehouse.example.com;

    # Point these at your certificate (e.g. from certbot / Let's Encrypt).
    ssl_certificate     /etc/letsencrypt/live/warehouse.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/warehouse.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Absolute path to `npm --prefix frontend run build` output.
    root /srv/warehouse/frontend/dist;
    index index.html;

    # Matches the API's 5 MB image limit with headroom for the multipart envelope.
    client_max_body_size 6m;

    # API - everything under /api is forwarded to NestJS (which keeps the /api prefix).
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
    }

    # Health check is registered without the /api prefix in main.ts.
    location = /health {
        proxy_pass       http://127.0.0.1:3000/health;
        proxy_set_header Host $host;
        access_log       off;
    }

    # Product images are served by the API from the persistent UPLOAD_DIR.
    # This must precede the SPA fallback or images would return index.html.
    location /uploads/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Hashed Vite assets can be cached aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA history fallback - unknown paths return index.html so BrowserRouter works.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
